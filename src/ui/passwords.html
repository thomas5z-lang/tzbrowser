<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Passwörter</title>
  <link rel="stylesheet" href="internal.css">
</head>
<body>
  <header>
    <div class="title">
      <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.6"/></svg>
      <div>
        <h1>Passwörter</h1>
        <p id="sub">Verschlüsselt mit deinem Windows-Konto · nur auf diesem PC</p>
      </div>
    </div>
    <input id="search" type="search" placeholder="Seite oder Benutzer suchen …" autocomplete="off" spellcheck="false">
  </header>

  <main>
    <div id="list"></div>
    <p id="empty" class="hint hidden">Noch keine Passwörter gespeichert. Melde dich einfach auf einer Seite an – TZBrowser fragt dann, ob es speichern soll.</p>

    <h2>Nie speichern für</h2>
    <div id="never"></div>
    <p id="never-empty" class="hint">Keine Ausnahmen.</p>
  </main>

  <div id="toast"></div>
  <script src="passwords.js"></script>
</body>
</html>
