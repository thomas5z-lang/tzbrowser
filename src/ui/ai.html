<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>TZBrowser KI</title>
  <style>
    :root { --accent: #fa1e4e; --bg: #0b0a10; --card: #15121d; --card2: #1c1827; --text: #f1eff6; --muted: #8d88a0; --line: #ffffff10; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }

    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    header .logo { width: 22px; height: 22px; }
    header .logo path { fill: var(--accent); stroke: none; }
    header h1 { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    header h1 span { color: var(--accent); }
    select { flex: 1; min-width: 0; height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--text); font: inherit; font-size: 12px; outline: 0; }
    .icon { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; }
    .icon:hover { color: var(--accent); background: #ffffff0d; }

    #settings { padding: 12px; background: var(--card); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
    #settings label { color: var(--muted); font-size: 12px; }
    #settings input { height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--text); font: inherit; outline: 0; }
    #settings input:focus { border-color: var(--accent); }
    #settings p { color: var(--muted); font-size: 11.5px; }

    #log { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 12px; border-radius: 3px; word-wrap: break-word; user-select: text; }
    .msg.user { align-self: flex-end; max-width: 88%; background: color-mix(in srgb, var(--accent) 20%, var(--card)); }
    .msg.bot { background: var(--card); border-left: 3px solid var(--accent); }
    .msg.err { background: #3a1018; border-left: 3px solid #ff4d6a; color: #ffb3c0; }
    .msg.info { color: var(--muted); font-size: 12px; text-align: center; background: transparent; padding: 0; }
    .msg pre { margin: 8px 0; padding: 8px; background: #000a; border-radius: 3px; overflow-x: auto; font: 12px Consolas, monospace; }
    .msg code { font: 12px Consolas, monospace; background: #0006; padding: 1px 4px; border-radius: 2px; }
    .msg ul, .msg ol { margin: 4px 0 4px 18px; }
    .msg p + p { margin-top: 6px; }
    .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .welcome { margin: auto 0; text-align: center; color: var(--muted); padding: 20px; }
    .welcome b { color: var(--text); }

    #quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 0; }
    #quick button { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
    #quick button:hover { border-color: var(--accent); color: var(--accent); }

    footer { padding: 10px 12px 12px; }
    .ctx { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .ctx input { accent-color: var(--accent); }
    .box { display: flex; gap: 6px; align-items: flex-end; }
    textarea { flex: 1; min-height: 40px; max-height: 160px; padding: 9px 10px; resize: none; border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--text); font: inherit; outline: 0; }
    textarea:focus { border-color: var(--accent); }
    #send { width: 40px; height: 40px; border: 0; border-radius: 3px; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
    #send:hover { filter: brightness(1.1); }
    #send.stop { background: #2a2635; color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 64 64"><path d="M10 14h20v8h-6v28h-8V22h-6zM34 14h20v8L43 42h11v8H34v-8l11-20H34z"/></svg>
    <h1>TZBrowser <span>KI</span></h1>
    <select id="model" title="Modell"></select>
    <button id="new" class="icon" title="Neuer Chat"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <button id="gear" class="icon" title="Einstellungen"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  </header>

  <div id="settings" class="hidden">
    <label for="url">Ollama-Adresse</label>
    <input id="url" spellcheck="false" placeholder="http://localhost:11434">
    <p>Läuft Ollama auf einem anderen PC (z. B. dem Notebook), dort <code>OLLAMA_HOST=0.0.0.0</code> setzen und hier dessen IP eintragen, z. B. http://192.168.178.50:11434</p>
  </div>

  <div id="log">
    <div class="welcome" id="welcome">
      <p><b>Hallo! Ich bin TZBrowser KI.</b></p>
      <p>Frag mich etwas – oder lass mich die aktuelle Seite zusammenfassen.</p>
    </div>
  </div>

  <div id="quick">
    <button data-q="sum">Seite zusammenfassen</button>
    <button data-q="simple">Einfach erklären</button>
    <button data-q="points">Kernaussagen</button>
    <button data-q="translate">Auf Deutsch übersetzen</button>
  </div>

  <footer>
    <div style="display:flex;gap:14px">
      <label class="ctx"><input type="checkbox" id="usepage"> Aktuelle Seite einbeziehen</label>
      <label class="ctx" title="Denkmodelle wie qwen3 überlegen erst ausführlich – genauer, aber langsamer"><input type="checkbox" id="think"> Gründlich nachdenken</label>
    </div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="Nachricht an TZBrowser KI … (Enter senden, Umschalt+Enter neue Zeile)"></textarea>
      <button id="send" title="Senden"><svg viewBox="0 0 16 16"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg></button>
    </div>
  </footer>

  <script src="ai.js"></script>
</body>
</html>
