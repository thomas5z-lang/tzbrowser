<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: file:; style-src 'self'; script-src 'self'">
  <title>TZBrowser Seitenleiste</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <nav id="apps"></nav>
  <div class="sep"></div>
  <nav id="tools">
    <button id="t-bookmarks" class="item" title="Lesezeichen (Strg+Umschalt+O)">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
    </button>
    <button id="t-history" class="item" title="Verlauf (Strg+H)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    </button>
    <button id="t-passwords" class="item" title="Passwörter">
      <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4"/></svg>
    </button>
    <button id="t-vpn" class="item" title="VPN (Cloudflare WARP)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.8 5.7 3.8 9s-1.2 6.2-3.8 9c-2.6-2.8-3.8-5.7-3.8-9S9.4 5.8 12 3z"/></svg>
    </button>
    <button id="t-downloads" class="item" title="Downloads">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10.5l5 5 5-5M4 20h16"/></svg>
    </button>
  </nav>
  <div class="spacer"></div>
  <nav>
    <button id="t-theme" class="item" title="Design & Akzentfarbe">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1.1-1.6-1.1-2.8 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7.3" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
    </button>
  </nav>
  <script src="theme.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
