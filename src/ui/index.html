<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: file:; style-src 'self'; script-src 'self'; media-src blob: data:">
  <title>TZBrowser</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="tabbar">
    <button id="logo" title="TZBrowser-Menü">
      <svg viewBox="0 0 64 64"><path class="body" d="M10 14h20v8h-6v28h-8V22h-6zM34 14h20v8L43 42h11v8H34v-8l11-20H34z"/></svg>
    </button>
    <div id="tabs"></div>
    <button id="newtab" class="icon-btn" title="Neuer Tab (Strg+T)">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
    </button>
  </div>

  <div id="toolbar">
    <button id="back" class="icon-btn" title="Zurück (Alt+←)">
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button id="forward" class="icon-btn" title="Vorwärts (Alt+→)">
      <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg>
    </button>
    <button id="reload" class="icon-btn" title="Neu laden (F5)">
      <svg class="i-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5V5h-2.5"/></svg>
      <svg class="i-stop" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>

    <form id="addressform" autocomplete="off">
      <span id="lock" title=""></span>
      <span id="ctag"></span>
      <input id="address" type="text" spellcheck="false" placeholder="Suchen oder Adresse eingeben">
      <button id="reader" class="icon-btn small hidden" type="button" title="Lesemodus (F9)">
        <svg viewBox="0 0 16 16"><path d="M8 4.2C6.6 3 4.6 2.6 2 2.8v9.6c2.6-.2 4.6.2 6 1.4 1.4-1.2 3.4-1.6 6-1.4V2.8c-2.6-.2-4.6.2-6 1.4zM8 4.2v9.6"/></svg>
      </button>
      <button id="av" class="icon-btn small hidden" type="button" title="Anime-Vorleser">
        <svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/><path d="M5.5 6.2v1.6M8 5.4v3.2M10.5 6.2v1.6"/></svg>
      </button>
      <button id="translate" class="icon-btn small hidden" type="button" title="Übersetzung">
        <svg viewBox="0 0 16 16"><path d="M1.5 3.5h7M5 2v1.5M3 3.5c.5 2.5 2.3 4.4 4.5 5.2M7 3.5c-.6 2.6-2.4 4.6-5 5.6M8.5 14l3-7 3 7M9.6 11.5h3.8"/></svg>
      </button>
      <button id="star" class="icon-btn small" type="button" title="Lesezeichen setzen (Strg+D)">
        <svg viewBox="0 0 16 16"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
      </button>
      <button id="video" class="icon-btn small hidden" type="button" title="Mediendatei speichern">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="3.5" width="9" height="9" rx="2"/><path d="m10.5 7 4-2.5v7l-4-2.5"/></svg>
      </button>
    </form>

    <browser-action-list id="actions" alignment="bottom left"></browser-action-list>

    <button id="speak" class="icon-btn hidden" title="Vorlesen stoppen">
      <svg viewBox="0 0 16 16"><path d="M2.5 6v4h2.5l3.5 3V3L5 6zM11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8"/></svg>
    </button>

    <button id="vpn" class="off" title="VPN (Cloudflare WARP) einschalten – Strg+Umschalt+V">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 1.9 2.6 3.9 2.6 6.2S9.8 12.3 8 14.2C6.2 12.3 5.4 10.3 5.4 8S6.2 3.7 8 1.8z"/></svg>
      <span id="vpn-label">VPN</span>
    </button>

    <div id="shield" class="loading" title="Werbeblocker lädt …">
      <svg viewBox="0 0 16 16"><path d="M8 1.5 2.5 3.5v4c0 3.3 2.3 5.9 5.5 7 3.2-1.1 5.5-3.7 5.5-7v-4z"/></svg>
      <span id="blocked">0</span>
    </div>

    <button id="downloads" class="icon-btn" title="Downloads (Strg+J)">
      <svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10"/></svg>
      <span id="dl-ring"></span>
      <span id="dl-badge" class="hidden"></span>
    </button>
    <button id="quick-btn" class="icon-btn" title="Schnelleinstellungen (bleibt offen)">
      <svg viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg>
    </button>
    <button id="menu" class="icon-btn" title="Menü öffnen">
      <svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
    </button>
  </div>

  <form id="findbar" autocomplete="off">
    <input id="find" type="text" spellcheck="false" placeholder="Auf Seite suchen">
    <span id="find-count"></span>
    <button id="find-prev" class="icon-btn small" type="button" title="Vorheriger Treffer (Umschalt+F3)">
      <svg viewBox="0 0 16 16"><path d="m4 10 4-4 4 4"/></svg>
    </button>
    <button id="find-next" class="icon-btn small" type="button" title="Nächster Treffer (F3)">
      <svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg>
    </button>
    <button id="find-close" class="icon-btn small" type="button" title="Suche schließen (Esc)">
      <svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </form>

  <div id="suggest" class="hidden"></div>

  <div id="quick" class="hidden">
    <div class="q-head"><span>Schnelleinstellungen</span><button id="quick-close" class="icon-btn small" title="Schließen (Esc)"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
    <div id="quick-list"></div>
    <div id="quick-restart" class="hidden">⚠ Wirkt nach Neustart von TZBrowser</div>
    <button id="quick-all" class="q-link">Alle Einstellungen …</button>
  </div>

  <script src="theme.js"></script>
  <script src="ui.js"></script>
</body>
</html>
